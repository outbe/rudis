# network.yaml - describes an Outbe network; produces its genesis.
#
#   python3 scripts/create_genesis.py network.yaml
#
# The uncommented block below is the whole required input. Every commented
# key shows its default value; uncomment to change it. Section defaults come
# from scripts/seed-testnet.json, the single baseline profile.

network: testnet
chain_id: 70860602
enclave_sgx: true

# One host or IP per founding validator, in order. OCOMP V1 fixes the
# founding committee at four members. Append `:port` to give one validator a
# consensus port of its own (`- 10.0.0.3:31555`).
validators:
  - 10.0.0.1
  - 10.0.0.2
  - 10.0.0.3
  - 10.0.0.4

# Key material, one directory per validator in the order above:
#   keys_dir/validator-0/signing-key.hex          BLS consensus key
#   keys_dir/validator-0/evm-key.hex              EVM signer
#   keys_dir/validator-0/radicle/keys/radicle.pub Radicle identity
#   keys_dir/validator-0/ocomp-registration-v1.ocb1   minted here if absent
# Produced by `outbe-keygen validator --output-dir <dir> --chain-id <id>`.
# Public keys, addresses and node ids are read from these files - nothing is
# duplicated into this yaml.
keys_dir: ./keys

tee:
  mode: gramine-direct-dev            # | dcap-required
  # dcap-required additionally needs the exact release measurements:
  # mrenclave: "<32-byte hex>"
  # mrsigner: "<32-byte hex>"
  # isv_prod_id: 0
  # minimum_isv_svn: 0
  # minimum_tcb_evaluation_data_number: 0

# --- Everything below is optional ----------------------------------------

# Where the bundle will live on the validator machines. The generated run
# scripts use these paths; they default to wherever you run this script.
# remote_base_dir: /opt/outbe
# remote_keys_dir: /opt/outbe/keys

# Dev lane only: the container image the mock/gramine-direct enclave runs from.
# enclave_image: outbe-tee-enclave:latest
# Production (dcap-required) runs gramine-sgx on the host instead - point
# these at the release enclave checkout on each machine.
# enclave_dir: /opt/outbe-chain/enclave
# enclave_runner: ./run-enclave.sh     # TEE enclave container image

# Binaries on the validator machines; default to PATH lookups.
# node_binary: outbe-chain
# ocomp_binary: outbe-ocomp
# radicle_binary: outbe-radicle
# feeder_binary: outbe-feeder

# Price source for the oracle feeder.
# price_feed_rest: https://prc.testnet.outbe.net
# For an exchange `price_provider`, optionally override its built-in stream URL:
# price_feed_websocket: wss://stream.binance.com:9443/ws

# Ports. Founders sit on separate machines, so they all share one layout;
# pin a single validator's consensus port inline instead (`- 10.0.0.3:31555`).
# consensus_p2p_port: 30400
# reth_p2p_port: 30303
# reth_discv5_port: 31303
# rpc_port: 8545
# authrpc_port: 8551
# metrics_port: 9101
# radicle_port: 8776
# radicle_status_port: 8876
# tee_enclave_port: 17000
# feeder_health_port: 9002
# mongodb_port: 27017

# output: genesis.json                # also settable via --output
# chain_binary: target/release/outbe-chain    # genesis build only, on this box
# keygen_binary: target/release/outbe-keygen  # genesis build only, on this box
# timestamp: 1756032000               # genesis timestamp; default: now
# gas_limit: "0x1c9c380"
# epoch_length_blocks: 300
# dkg_prepare_window_blocks: 30
# dkg_activation_grace_blocks: 30
# prefund_coen_units: 10000000000000000000000 # 10000 COEN per validator
# worldwide_day: 20260824             # default: derived from the timestamp
# fresh_metadosis: true               # do not seed an already-OFFERING day
# contracts_dir: scripts/contracts    # code files for the `contracts` section
# canon_dir: scripts/canon            # metacanon.md / canon.md source

# Protocol timings, copied verbatim into config.outbeProtocol.
# ONLY a `test-protocol-overrides` build accepts this field; a production
# binary rejects the genesis outright. Use it for localnet and E2E networks,
# never for a production one, which runs the built-in schedule.
#
# SHORTENING THE METADOSIS WINDOWS WILL STOP A NETWORK THAT STARTS MID-DAY.
# A worldwide day measures its windows from midnight UTC, not from the moment
# the network boots (`forming_start = wwd.start_timestamp()`). With, say, a
# 900s forming and a 600s offering, a day's offering closed at 00:25 UTC - so a
# network started at 10:00 creates a day that is already nine hours past its
# window, the reducer moves it straight to MissedOffering, and the
# ProtocolCycle dies with `MissedOffering requires an immutable formed day
# limit`. No blocks are produced at all.
#
# The live testnet sets schemaVersion 1 and metadosis.lookbackDelaySeconds 0,
# and nothing else - the rest stays on the built-in schedule (50h forming /
# 50h offering), which covers a start at any time of day. Copy that shape.
#
# Every knob, for reference - set the timings only if the network genuinely
# needs short cycles AND you start it right after midnight UTC:
# protocol_constants:
#   schemaVersion: 1
#   metadosis:
#     formingPeriodSeconds: 180000
#     lookbackDelaySeconds: 1807200
#     offeringPeriodSeconds: 180000
#     waitingPeriodSeconds: 43200
#     bootstrapDurationSeconds: 300
#     advanceIntervalSeconds: 10
#   ocomp:
#     computeVoteWindowBlocks: 120

