[chain]
rpc_endpoint = "http://127.0.0.1:8545"
chain_id = 70860602
gasless_oracle_votes = true

[account]
# scripts/price-oracle/run.sh rewrites this from <testnet-dir>/validator-N/evm-key.hex.
private_key = "REPLACE_WITH_FEEDER_PRIVATE_KEY"
# scripts/price-oracle/run.sh rewrites this from <testnet-dir>/validators.json.
validator_address = "0x1111111111111111111111111111111111111111"

[oracle]
vote_period = 8
poll_interval_secs = 2

[health]
enabled = true
bind_address = "0.0.0.0:9002"

# Mock REST price server from the test config.
[[provider_endpoints]]
name = "mock_http"
rest = "https://prc.testnet.outbe.net"

[[currency_pairs]]
base = "rudis"
quote = "840"

[[currency_pairs.sources]]
provider = "mock_http"
base = "COEN"
quote = "840"

[[deviation_thresholds]]
base = "rudis"
threshold = "2.0"
