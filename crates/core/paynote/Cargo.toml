[package]
name = "outbe-paynote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-primitives.workspace = true
outbe-vaultrouter.workspace = true
outbe-macros.workspace = true
outbe-poseidon.workspace = true
outbe-protocol.workspace = true
outbe-zk-backend.workspace = true
outbe-zk-canonical.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
ark-bn254.workspace = true
ark-ff.workspace = true
thiserror.workspace = true


[dev-dependencies]
outbe-paynote = { path = ".", features = ["test-utils"] }

# The self dev-dependency activates `test-utils` for this crate's unit tests;
# cargo-udeps cannot observe dependencies used only through that feature edge.
[package.metadata.cargo-udeps.ignore]
development = ["outbe-paynote"]

[features]
default = []
test-utils = []

[lints]
workspace = true
