[package]
name = "outbe-promisfactory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
outbe-primitives = { workspace = true, features = ["test-utils"] }
outbe-promis.workspace = true
# The promis→gratis conversion mints through the Gratis factory's own seam, so the
# acquisition Fidelity cohort is recorded exactly as for any other gratis mint.
outbe-gratisfactory.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true

[dev-dependencies]
# Drive the confidential Promis + Gratis paths in tests via the in-process enclave
# engine (mineGratis burns confidential promis then mints confidential gratis).
outbe-promis = { workspace = true, features = ["test-enclave"] }
outbe-gratis = { workspace = true, features = ["test-enclave"] }
outbe-fidelity = { workspace = true, features = ["test-enclave"] }
outbe-tee.workspace = true
outbe-tee-enclave.workspace = true

[lints]
workspace = true
