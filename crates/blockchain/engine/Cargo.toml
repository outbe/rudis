[package]
name = "outbe-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Engine layer that glues pure `outbe-consensus` (Simplex/hybrid/DKG/proof) with
# `outbe-evm` (execution), `outbe-validatorset` (storage facade), and
# `outbe-node` (Reth node assembly). Owns the stack startup, the consensus
# application handler tests, the validators ValidatorSet reader, and the peer
# manager actor. Anything that needs both consensus and EVM lives here.

[features]
default = []

[dependencies]
# Internal
outbe-consensus.workspace = true
outbe-compressed-entities.workspace = true
outbe-evm.workspace = true
outbe-ocomp-protocol.workspace = true
outbe-node.workspace = true
outbe-primitives.workspace = true
outbe-radicle.workspace = true
outbe-validatorset.workspace = true
outbe-teeregistry.workspace = true
outbe-tee.workspace = true
outbe-update.workspace = true

# Commonware
commonware-actor.workspace = true
commonware-broadcast.workspace = true
commonware-consensus.workspace = true
commonware-cryptography.workspace = true
commonware-macros.workspace = true
commonware-p2p.workspace = true
commonware-runtime.workspace = true
commonware-storage.workspace = true
commonware-codec.workspace = true
commonware-utils.workspace = true
commonware-math.workspace = true
commonware-parallel.workspace = true

# Reth
reth-ethereum = { workspace = true, features = ["node", "node-api", "storage-api", "network"] }
reth-node-builder.workspace = true
reth-provider.workspace = true
reth-chain-state.workspace = true
reth-storage-api.workspace = true

# Alloy
alloy-primitives.workspace = true
alloy-eips.workspace = true
alloy-consensus.workspace = true
bytes.workspace = true

# Crypto
k256.workspace = true

# Utilities
clap.workspace = true
eyre.workspace = true
futures.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rand_core.workspace = true
tracing.workspace = true
metrics.workspace = true
thiserror.workspace = true

# Follower upstream RPC client (HTTP) for --upstream full-node mode.
jsonrpsee = { version = "0.26", default-features = false, features = ["http-client"] }

[dev-dependencies]
outbe-primitives = { workspace = true, features = ["test-utils"] }
alloy-rpc-types-engine.workspace = true
outbe-consensus = { workspace = true, features = ["test-utils"] }
outbe-validatorset = { workspace = true, features = ["test-utils"] }
commonware-resolver = { git = "https://github.com/commonwarexyz/monorepo", tag = "v2026.5.0" }
tempfile.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt"] }
metrics-util = "0.20"
proptest.workspace = true

[package.metadata.cargo-machete]
ignored = ["metrics"]

[lints]
workspace = true
