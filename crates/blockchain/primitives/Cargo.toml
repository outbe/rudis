[package]
name = "outbe-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rand = { workspace = true, optional = true }
outbe-ocomp-protocol.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true
alloy-evm.workspace = true
bytes.workspace = true
reth-ethereum = { workspace = true, features = ["node"] }
reth-ethereum-engine-primitives.workspace = true
reth-codecs.workspace = true
reth-node-builder.workspace = true
reth-payload-primitives.workspace = true
reth-primitives-traits.workspace = true
reth-rpc-traits.workspace = true
revm.workspace = true
ring.workspace = true
# Validator-set data types (ValidatorSet / ValidatorP2pAddress) live here so
# both `outbe-consensus` and `outbe-engine` see the same canonical types
# without `outbe-consensus` having to depend on `outbe-engine` and without
# `outbe-engine`-only callers re-deriving the shape.
commonware-cryptography.workspace = true
commonware-p2p.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
# `WorldwideDay::is_valid` calendar checks.
time.workspace = true
# Async request/response channel for the bridge's finalization fetcher (the
# follower-upstream `rudis_getFinalization` serving path crosses the
# outbe-rpc -> consensus crate boundary through the bridge). `sync` only.
tokio = { workspace = true, features = ["sync"] }
# Validator EVM signer (system-tx signing key). Lives here so consensus does
# not need an `outbe-evm` dep just for the signer type.
k256.workspace = true
zeroize.workspace = true
hex.workspace = true

[dev-dependencies]
rand.workspace = true
outbe-primitives = { path = ".", features = ["test-utils"] }
alloy-primitives = { workspace = true, features = ["rand"] }
ed25519-dalek.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
bench-utils = []
# Retarget the Intex CREATE3 addresses at the throwaway e2e set. Never in a release build.
e2e-test = []
test-utils = ["dep:rand"]
tee-attestation-v1 = []

[lints]
workspace = true
