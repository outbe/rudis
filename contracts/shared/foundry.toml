# Protocol-wide Solidity shared across the contracts/* projects. Consumers remap "@shared/" here.

[profile.default]
  bytecode_hash = "none"
  cbor_metadata = false
  evm_version = "Prague"
  optimizer = true
  optimizer_runs = 10_000
  via_ir = true
  out = "out"
  script = "script"
  solc = "0.8.30"
  src = "src"
  libs = ["dependencies"]
  remappings = [
    "@openzeppelin/contracts/=dependencies/openzeppelin-contracts-5.6.1/contracts/",
    "forge-std/=dependencies/forge-std-1.16.1/src/",
  ]

[soldeer]
# Remappings are maintained by hand in [profile.default]; do not let soldeer overwrite them.
remappings_generate = false

[rpc_endpoints]
outbe-dev="https://eth.d.outbe.net"
bsc-testnet="https://bsc-testnet-rpc.publicnode.com"
outbe-testnet="${OUTBE_RPC_URL}"


[dependencies]
forge-std = { version = "1.16.1", git = "https://github.com/foundry-rs/forge-std", rev = "b3bc8b154382a75d0b0ef22d7fd4a0a5f0feee0e" }
openzeppelin-contracts = { version = "5.6.1", git = "https://github.com/OpenZeppelin/openzeppelin-contracts", rev = "5a3b28fc5bd3976da5ea38d90d88ba26f1e0a335" }
