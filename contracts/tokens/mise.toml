[tasks.install]
description = "Install dependencies using soldeer"
run = "forge soldeer install"

[tasks.build]
description = "Build Solidity contracts using forge"
run = "forge build"

[tasks.export-abi]
description = "Export contracts ABI (auto-discovers src/interfaces/I*.sol)"
depends = ["build"]
run = '''
echo 'Exporting ABI for smart contracts'
mkdir -p ./abi-export
rm -rf ./abi-export/*.json
# Addressed as `<path>:<name>`, not via out/<name>.sol/: dependency interfaces
# share a basename with ours (e.g. OpenZeppelin's IERC20.sol) and would
# otherwise silently win the artifact slot.
for sol_file in ./src/interfaces/I*.sol; do
  contract=$(basename "$sol_file" .sol)
  if forge inspect "${sol_file#./}:${contract}" abi --json > ./abi-export/${contract}.json 2>/dev/null; then
    echo "  exported ${contract}"
  else
    rm -f ./abi-export/${contract}.json
    echo "  WARNING: no compiled artifact for ${contract}" >&2
  fi
done
'''

[tasks.test]
description = "Test Solidity contracts using forge"
run = "forge test"

[tasks.fmt]
description = "Format Solidity code"
run = "forge fmt"

[tasks.lint]
description = "Lint Solidity code"
run = "forge lint"

[tasks.clean]
description = "Clean up forge artifacts"
run = "forge clean"

[tasks.clean-all]
description = "Clean all build artifacts, and caches"
depends = ["clean"]
run = '''
forge soldeer clean
rm -rf ./out ./build ./cache
'''

[tasks.deploy-routes]
description = "Deploy both token routes on one chain via CREATE3"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
: "${NETWORK:?set NETWORK to an rpc_endpoints alias, e.g. sepolia}"
forge script script/1_DeployRoutes.s.sol:DeployRoutes --rpc-url "$NETWORK" --broadcast --slow -vvv
'''

[tasks.configure-remotes]
description = "Wire remote bridges for both routes (per REMOTE_CHAIN_IDS)"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
: "${NETWORK:?set NETWORK to an rpc_endpoints alias, e.g. sepolia}"
forge script script/2_ConfigureRemotes.s.sol:ConfigureRemotes --rpc-url "$NETWORK" --broadcast --slow -vvv
'''

[tasks.deploy-all]
description = "Deploy both routes + remote wiring on one chain"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
: "${NETWORK:?set NETWORK to an rpc_endpoints alias, e.g. sepolia}"
forge script script/DeployAll.s.sol:DeployAll --rpc-url "$NETWORK" --broadcast --slow -vvv
'''

[tasks.send]
description = "Send across one route (ROUTE, DEST_CHAIN_ID, RECIPIENT, SEND_AMOUNT_LD)"
run = '''
set -a; f="${ENV_FILE:-.env}"; [ -f "$f" ] && . "$f"; set +a
: "${NETWORK:?set NETWORK to an rpc_endpoints alias, e.g. sepolia}"
forge script script/Send.s.sol:Send --rpc-url "$NETWORK" --broadcast --slow -vvv
'''
